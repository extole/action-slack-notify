name: 'Slack Notify'
description: 'Posts a GitHub Actions notification to a Slack incoming webhook. Needs bash, jq and curl, and no Docker.'
runs:
  using: 'composite'
  steps:
    - name: Post to Slack
      run: '"$GITHUB_ACTION_PATH/slack-notify"'
      shell: bash
branding:
  icon: 'bell'
  color: 'yellow'
